name: Build on Eden Room Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - scripts/**
      - .github/workflows/docker-build.yml
  schedule:
    # Daily upstream check in UTC.
    - cron: '57 3 * * *'

concurrency:
  group: eden-room-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EDEN_REPOSITORY: https://git.eden-emu.dev/eden-emu/eden.git

jobs:
  patch-check:
    name: Validate Eden patches
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Get latest Eden commit
        id: eden
        run: |
          COMMIT=$(git ls-remote "$EDEN_REPOSITORY" HEAD | awk '{print $1}')
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest Eden commit: $COMMIT"

      - name: Clone Eden
        run: |
          git clone --depth=1 "$EDEN_REPOSITORY" eden-src
          echo "Eden commit: $(cd eden-src && git log -1 --format='%H %s')"

      - name: Run patch script against Eden source
        run: |
          cd eden-src
          python3 ../scripts/apply-eden-room-patches.py
          git diff --check

  check-and-build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: patch-check
    permissions:
      contents: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Get latest Eden commit
        id: eden
        run: |
          COMMIT=$(git ls-remote "$EDEN_REPOSITORY" HEAD | awk '{print $1}')
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          echo "Latest Eden commit: $SHORT_COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check last built commit
        id: last_build
        run: |
          if [ -f ".last_eden_commit" ]; then
            LAST_COMMIT=$(cat .last_eden_commit)
            echo "Last built commit: $LAST_COMMIT"
            echo "last_commit=$LAST_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "No previous build found"
            echo "last_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone Eden to check changes
        if: steps.last_build.outputs.last_commit != ''
        run: git clone --depth=100 "$EDEN_REPOSITORY" eden-upstream

      - name: Check if Eden room/network files changed
        if: steps.last_build.outputs.last_commit != ''
        id: check_changes
        run: |
          cd eden-upstream

          LAST_COMMIT="${{ steps.last_build.outputs.last_commit }}"
          NEW_COMMIT="${{ steps.eden.outputs.commit }}"

          CHANGED_FILES=$(git diff --name-only "$LAST_COMMIT" "$NEW_COMMIT" 2>/dev/null || echo "force_build")

          if [ "$CHANGED_FILES" = "force_build" ]; then
            echo "Could not compare commits; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEVANT_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^src/(dedicated_room|web_service|network|common/logging|common/socket_types\.h|core/internal_network|core/hle/service/(ldn|sockets|nifm))/' || true)

          if [ -n "$RELEVANT_CHANGES" ]; then
            echo "Eden room/network related files changed:"
            echo "$RELEVANT_CHANGES"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Eden room/network files changed since last build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: final_check
        run: |
          if [ -z "${{ steps.last_build.outputs.last_commit }}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=${{ steps.check_changes.outputs.should_build }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no changes
        if: steps.final_check.outputs.should_build == 'false'
        run: echo "No Eden room/network changes detected. Skipping image build."

      - name: Set up Docker Buildx
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:${{ steps.eden.outputs.short_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EDEN_REF=${{ steps.eden.outputs.commit }}

      - name: Update last built commit
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.eden.outputs.commit }}" > .last_eden_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_eden_commit
          git diff --staged --quiet || git commit -m "Built from Eden commit ${{ steps.eden.outputs.short_commit }}"
          git push

      - name: Notify Discord
        if: steps.final_check.outputs.should_build == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not configured, skipping notification."
            exit 0
          fi

          COMMIT="${{ steps.eden.outputs.short_commit }}"
          MESSAGE="New Eden Room Server built from commit ${COMMIT}."
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${MESSAGE}\"}" || true

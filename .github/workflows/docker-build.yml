name: Build on Eden Room Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - scripts/**
      - tests/**
      - .maintenance/inputs.json
      - .github/workflows/docker-build.yml
  schedule:
    # Shared weekly check: Sunday 03:00 AEST / 04:00 AEDT, a day before Unraid's Monday 5 am update.
    - cron: '0 17 * * 6'

concurrency:
  group: eden-room-build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
  EDEN_REPOSITORY: https://git.eden-emu.dev/eden-emu/eden.git
  MARKER_FILE: .last_eden_commit

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Test wrapper relay banner
        run: python3 tests/test-relay-banner.py

      - name: Get latest Eden commit
        id: eden
        run: |
          set -euo pipefail
          COMMIT=$(git ls-remote "$EDEN_REPOSITORY" HEAD | awk '{print $1}')
          test -n "$COMMIT"
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          echo "Latest Eden commit: $SHORT_COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check last built commit
        id: last_build
        run: |
          if [ -f "${MARKER_FILE}" ]; then
            LAST_COMMIT=$(cat "${MARKER_FILE}")
            echo "Last built commit: $LAST_COMMIT"
            echo "last_commit=$LAST_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "No previous build found"
            echo "last_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test input decisions
        working-directory: .
        run: python3 tests/test-ci-inputs.py

      - name: Decide whether to build
        id: final_check
        working-directory: .
        run: python3 scripts/ci_inputs.py probe --snapshot "${RUNNER_TEMP}/build-inputs.json" --upstream eden=${{ steps.eden.outputs.commit }}

      - name: Skip if no upstream changes
        if: steps.final_check.outputs.should_build == 'false'
        run: echo "No upstream changes detected. Skipping image build."

      - name: Clone Eden
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          git clone --depth=1 "$EDEN_REPOSITORY" eden-src
          git -C eden-src checkout --detach "${{ steps.eden.outputs.commit }}"
          echo "Eden commit: $(cd eden-src && git log -1 --format='%H %s')"

      - name: Run patch script against Eden source
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          cd eden-src
          python3 ../scripts/apply-eden-room-patches.py
          git diff --check

      # The patch script above answers "do these edits still find their source
      # blocks". It cannot answer "does this patch still do anything" -- work
      # Eden does upstream can quietly make one of these redundant while the
      # patch keeps applying. This reads Eden's commits and says so.
      - name: Review upstream intent against the patch set
        id: watch
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          python3 scripts/patch-watch.py \
            --manifest patch-watch.json \
            --old "${{ steps.last_build.outputs.last_commit }}" \
            --new "${{ steps.eden.outputs.commit }}" \
            --work-dir "${RUNNER_TEMP}/upstream-mirror" \
            --findings-out "${RUNNER_TEMP}/patch-watch-findings.md"

      - name: Open a tracking issue when a patch may be redundant
        if: steps.final_check.outputs.should_build == 'true' && steps.watch.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Patch review needed: upstream may have superseded a patch"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "${RUNNER_TEMP}/patch-watch-findings.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "${RUNNER_TEMP}/patch-watch-findings.md"
          fi

      - name: Test entrypoint lifecycle
        run: python3 tests/test-entrypoint.py

      - name: Set up Docker Buildx
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Log in to Docker Hub
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pin the selected base manifests for this build
        if: steps.final_check.outputs.should_build == 'true'
        run: python3 scripts/ci_inputs.py pin --snapshot "${RUNNER_TEMP}/build-inputs.json" --dockerfile Dockerfile

      - name: Build Docker image
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ steps.final_check.outputs.refresh == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:patch-${{ github.sha }}-upstream-${{ steps.eden.outputs.short_commit }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Crunch41/eden-room-docker
            io.crunch41.upstream.revision=${{ steps.eden.outputs.commit }}
          build-args: |
            EDEN_REF=${{ steps.eden.outputs.commit }}
      - name: Verify non-root startup and graceful shutdown
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          image="${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest"
          name="eden-smoke-${GITHUB_RUN_ID}"
          trap 'docker logs "$name" 2>&1 || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --cpus 1 --memory 512m "$image"
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
          docker exec "$name" gosu eden test -r /usr/local/bin/docker-entrypoint.sh
          docker stop -t 10 "$name"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$name")" != 137

      - name: Exercise real ENet room protocol and admission guards
        if: steps.final_check.outputs.should_build == 'true'
        run: python3 tests/test-room-protocol.py "${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest"

      - name: Reject publication after a concurrent source push
        if: steps.final_check.outputs.should_build == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          actual="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual" = "$expected" || { echo "::error::main moved; retry on the newer validated source"; exit 1; }

      - name: Publish verified image
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:patch-${{ github.sha }}-upstream-${{ steps.eden.outputs.short_commit }}"

      - name: Update last built commit
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          (cd . && python3 scripts/ci_inputs.py record --snapshot "${RUNNER_TEMP}/build-inputs.json")
          echo "${{ steps.eden.outputs.commit }}" > "${MARKER_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MARKER_FILE}" .maintenance/last-build.json
          if ! git diff --staged --quiet; then
            git commit -m "Built from Eden commit ${{ steps.eden.outputs.short_commit }}"

            git push origin HEAD:main
          fi

      - name: Notify Discord
        if: steps.final_check.outputs.should_build == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not configured, skipping notification."
            exit 0
          fi

          COMMIT="${{ steps.eden.outputs.short_commit }}"
          MESSAGE="New Eden Room Server built from commit ${COMMIT}."
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${MESSAGE}\"}" || true

      - name: Persist a failed build or publication
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Automatic update failed"
          report="${RUNNER_TEMP}/failure.md"
          printf 'Validation, publication, or recording failed. Inspect the failed step before retrying.\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$report"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Automatic update failed" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
          fi

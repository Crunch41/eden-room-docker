name: Build on Eden Room Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - scripts/**
      - .github/workflows/docker-build.yml
  schedule:
    # Daily upstream check in UTC.
    - cron: '57 3 * * *'

concurrency:
  group: eden-room-build-${{ github.ref }}
  cancel-in-progress: true

env:
  EDEN_REPOSITORY: https://git.eden-emu.dev/eden-emu/eden.git
  MARKER_FILE: .last_eden_commit

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Get latest Eden commit
        id: eden
        run: |
          COMMIT=$(git ls-remote "$EDEN_REPOSITORY" HEAD | awk '{print $1}')
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          echo "Latest Eden commit: $SHORT_COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_commit=$SHORT_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check last built commit
        id: last_build
        run: |
          if [ -f "${MARKER_FILE}" ]; then
            LAST_COMMIT=$(cat "${MARKER_FILE}")
            echo "Last built commit: $LAST_COMMIT"
            echo "last_commit=$LAST_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "No previous build found"
            echo "last_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: final_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "Repo change or manual dispatch; forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ steps.last_build.outputs.last_commit }}" ]; then
            echo "No previous upstream marker found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.last_build.outputs.last_commit }}" != "${{ steps.eden.outputs.commit }}" ]; then
            echo "Upstream changed; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream unchanged; skipping image build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no upstream changes
        if: steps.final_check.outputs.should_build == 'false'
        run: echo "No upstream changes detected. Skipping image build."

      - name: Clone Eden
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          git clone --depth=1 "$EDEN_REPOSITORY" eden-src
          git -C eden-src checkout --detach "${{ steps.eden.outputs.commit }}"
          echo "Eden commit: $(cd eden-src && git log -1 --format='%H %s')"

      - name: Run patch script against Eden source
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          cd eden-src
          python3 ../scripts/apply-eden-room-patches.py
          git diff --check

      # The patch script above answers "do these edits still find their source
      # blocks". It cannot answer "does this patch still do anything" -- work
      # Eden does upstream can quietly make one of these redundant while the
      # patch keeps applying. This reads Eden's commits and says so.
      - name: Review upstream intent against the patch set
        id: watch
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          python3 scripts/patch-watch.py \
            --manifest patch-watch.json \
            --old "${{ steps.last_build.outputs.last_commit }}" \
            --new "${{ steps.eden.outputs.commit }}" \
            --work-dir "${RUNNER_TEMP}/upstream-mirror" \
            --findings-out "${RUNNER_TEMP}/patch-watch-findings.md"

      - name: Open a tracking issue when a patch may be redundant
        if: steps.final_check.outputs.should_build == 'true' && steps.watch.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Patch review needed: upstream may have superseded a patch"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file "${RUNNER_TEMP}/patch-watch-findings.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "${RUNNER_TEMP}/patch-watch-findings.md"
          fi

      - name: Set up Docker Buildx
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.final_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/eden-room-server:${{ steps.eden.outputs.short_commit }}
          build-args: |
            EDEN_REF=${{ steps.eden.outputs.commit }}
          cache-from: type=gha
          # ignore-error keeps a transient GitHub Actions cache outage (e.g. a 500
          # "Unicorn!" response during export) from failing an otherwise-good build.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Update last built commit
        if: steps.final_check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.eden.outputs.commit }}" > "${MARKER_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MARKER_FILE}"
          if ! git diff --staged --quiet; then
            git commit -m "Built from Eden commit ${{ steps.eden.outputs.short_commit }}"
            # Rebase onto any concurrent push before pushing the marker.
            git pull --rebase --autostash
            git push
          fi

      - name: Notify Discord
        if: steps.final_check.outputs.should_build == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not configured, skipping notification."
            exit 0
          fi

          COMMIT="${{ steps.eden.outputs.short_commit }}"
          MESSAGE="New Eden Room Server built from commit ${COMMIT}."
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${MESSAGE}\"}" || true
